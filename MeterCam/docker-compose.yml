services:
  metercam:
    build: .
    image: metercam:local
    container_name: metercam
    restart: unless-stopped
    ports:
      - "8770:8770"
    volumes:
      # config.json is gitignored and holds the camera address. Mounted rather
      # than baked in so a ROI change is an edit and a restart, not a rebuild.
      - ./config.json:/config/config.json:ro
      # The .tflite files. fetch.sh downloads them; they are not committed,
      # because jomjol's repositories state no licence and redistributing
      # someone's trained weights on that basis is not a fight worth having.
      - ./models:/models:ro
      # Frames, kept for debugging. ./data/images/gas/raw and .../rejected.
      # Also holds ref/gas.jpg, the alignment reference written by POST
      # /reference -- so this one is NOT read-only.
      - ./data:/data
    environment:
      # Unset means auth is off and /health says so. Fine on the bench, wrong
      # on the LAN. Put the real value in .env next to this file.
      METERCAM_TOKEN: "${METERCAM_TOKEN:-}"
      TZ: "${TZ:-Europe/Kyiv}"
