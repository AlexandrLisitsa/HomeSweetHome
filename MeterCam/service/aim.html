<!doctype html>
<!--
  Take a photo. That is the whole page.

  /capture returns a JPEG and /roi has a Capture button, but neither is the
  thing you want in your hand while you are aiming a camera or turning a lens:
  one hands the browser a bare image with no way to ask for another, and the
  other is a ROI editor with a photo in it. This is the button.

  Same rules as roi.html -- dependency-free, no build step, no CDN -- because
  it gets opened on a phone standing in front of a gas meter.

  The KB figure is a focus aid, not a measurement. At one resolution and one
  quality a crisp frame does not compress as far as a blurred one, so turning
  the lens and keeping the highest number walks you to best focus without
  anybody having to judge sharpness by eye on a phone screen.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeterCam &mdash; take a photo</title>
<style>
  :root { color-scheme: light dark; --line:#888; --sel:#0a84ff; --ok:#25a244; --bad:#d93025; }
  body { margin:0; font:13px/1.45 system-ui,sans-serif; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
           padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0;
           background:Canvas; z-index:5; }
  button, select, input { font:inherit; padding:4px 9px; }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #shoot { font-weight:600; }
  .muted { opacity:.65; }
  .bad { color:var(--bad); }
  #err { display:none; margin:12px; padding:10px; border-radius:4px;
         border:1px solid var(--bad); background:rgba(217,48,37,.10); }
  #err b { display:block; margin-bottom:4px; }
  #wrap { overflow:hidden; margin:12px; border:1px solid var(--line);
          background:#000; line-height:0; min-height:80px; }
  #shot { display:block; width:100%; transition:transform .1s;
          transform-origin:50% 50%; }
  #side { padding:0 12px 24px; }
  #num { font-size:28px; font-weight:600; }
  #bar { height:6px; background:rgba(128,128,128,.25); border-radius:3px;
         overflow:hidden; margin:6px 0; max-width:420px; }
  #fill { height:100%; width:0; background:var(--ok); transition:width .15s; }
  .zoom button.on { outline:2px solid var(--sel); }
</style>

<header>
  <label>meter <input id="meter" value="gas" size="6"></label>
  <button id="shoot">Take photo</button>
  <button id="last">Load last</button>
  <span class="muted">|</span>
  <span class="zoom">
    zoom
    <button data-z="1" class="on">1&times;</button>
    <button data-z="2">2&times;</button>
    <button data-z="4">4&times;</button>
    <button data-z="8">8&times;</button>
  </span>
  <span id="status" class="muted"></span>
</header>

<div id="err"></div>
<div id="wrap"><img id="shot" alt=""></div>

<div id="side">
  <div class="muted">Click the image to centre the zoom.</div>
  <div><span id="num">&mdash;</span> <span class="muted" id="peak"></span></div>
  <div id="bar"><div id="fill"></div></div>
  <div class="muted">
    Photo size, standing in for sharpness. Turn the lens
    <b>counter-clockwise</b> to focus closer, an eighth of a turn at a time,
    one photo between each, and keep the highest number.
    <button id="reset">reset peak</button>
  </div>
</div>

<script>
var img = document.getElementById('shot'), busy = false, peak = 0;
var zoom = 1, ox = 50, oy = 50, url = null;

function meter(){ return document.getElementById('meter').value || 'gas'; }
function status(t){ document.getElementById('status').textContent = t; }

function applyZoom(){
  img.style.transform = 'scale(' + zoom + ')';
  img.style.transformOrigin = ox + '% ' + oy + '%';
}
document.querySelectorAll('.zoom button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.zoom button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); zoom = +b.dataset.z; applyZoom();
  };
});
img.onclick = function(e){
  var r = img.getBoundingClientRect();
  ox = (e.clientX - r.left) / r.width * 100;
  oy = (e.clientY - r.top) / r.height * 100;
  applyZoom();
};

function fail(title, detail){
  var e = document.getElementById('err');
  e.innerHTML = '';
  var b = document.createElement('b'); b.textContent = title;
  e.appendChild(b);
  e.appendChild(document.createTextNode(detail || ''));
  e.style.display = 'block';
}

function show(blob, secs){
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(blob);
  img.src = url;
  document.getElementById('err').style.display = 'none';
  var kb = blob.size / 1024;
  if (blob.size > peak) peak = blob.size;
  document.getElementById('num').textContent = kb.toFixed(1) + ' KB';
  document.getElementById('peak').textContent = 'peak ' + (peak / 1024).toFixed(1) + ' KB';
  document.getElementById('fill').style.width =
    (peak ? Math.max(0, Math.min(100, blob.size / peak * 100)) : 0) + '%';
  status(secs != null ? 'took ' + secs.toFixed(1) + 's' : '');
}

// One request, two possible answers: a JPEG, or JSON explaining why not.
// The JSON one is the interesting case -- "Connection refused" from here means
// the camera in config.json is not answering, which is a different problem
// from MeterCam being down, and the page should say which.
function pull(path, label){
  if (busy) return;
  busy = true;
  var btns = document.querySelectorAll('header button');
  btns.forEach(function(b){ b.disabled = true; });
  var t0 = Date.now();
  var tick = setInterval(function(){
    status(label + '… ' + ((Date.now() - t0) / 1000).toFixed(1) + 's');
  }, 100);

  fetch(path).then(function(r){
    return r.blob().then(function(blob){ return { r: r, blob: blob }; });
  }).then(function(out){
    clearInterval(tick);
    var type = out.blob.type || '';
    if (out.r.ok && type.indexOf('image') === 0) {
      show(out.blob, (Date.now() - t0) / 1000);
    } else {
      return out.blob.text().then(function(text){
        var msg = text;
        try { msg = JSON.parse(text).error || text; } catch (e) {}
        status('');
        fail('HTTP ' + out.r.status + ' from MeterCam', msg);
      });
    }
  }).catch(function(e){
    clearInterval(tick);
    status('');
    fail('Could not reach MeterCam', String(e));
  }).then(function(){
    busy = false;
    btns.forEach(function(b){ b.disabled = false; });
  });
}

document.getElementById('shoot').onclick = function(){
  pull('/capture?meter=' + encodeURIComponent(meter()) + '&t=' + Date.now(),
       'taking a photo');
};
document.getElementById('last').onclick = function(){
  pull('/last.jpg?meter=' + encodeURIComponent(meter()) + '&t=' + Date.now(),
       'loading the last frame');
};
document.getElementById('reset').onclick = function(){
  peak = 0;
  document.getElementById('peak').textContent = '';
  document.getElementById('fill').style.width = '0';
};

// Something on screen straight away, without spending a camera round trip on
// it. If nothing has ever been read the 404 lands in the error box, which is
// the correct thing to say.
document.getElementById('last').click();
</script>
