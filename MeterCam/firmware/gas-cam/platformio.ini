; MeterCam's gas meter camera: AI-Thinker ESP32-CAM, OV2640.
;
; One build, src/main.cpp. Wakes on a timer, lights the meter, takes two
; frames, POSTs them to MeterCam, updates itself when MeterCam's answer offers
; a newer build, and goes back to sleep. Holds no state, keeps no clock and
; never waits to be called -- which is the whole reason it can sleep at all.
;
;   pio run                 build
;   pio run -t upload       flash over the MB programmer shield (first time,
;                           or to recover a board that cannot update itself)
;
; Every later build travels over the air: see docs/firmware.md.
;
; BUILD FROM POWERSHELL, NOT GIT BASH. PlatformIO refuses MSys/Mingw and
; leaves a half-installed esptool behind that every later build then trips
; over. Same trap as PowerStation/ -- see that project's notes.

[env:gas-cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; The camera needs PSRAM, and a UXGA frame is a ~2 MB allocation that will not
; come out of internal RAM.
;
; min_spiffs, NOT huge_app. OTA needs two app slots: the new build is written
; into the one not running. huge_app has ONE (3 MB ota_0, no ota_1), so every
; update failed with no partition to write to. min_spiffs gives two 1.875 MB
; slots; the build is ~1.07 MB. A partition change cannot travel by OTA: the
; first flash after this line changes must be over USB.
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; Kept deliberately small. Everything here is in the Arduino core or the
; ESP32 camera driver that ships with it; a meter camera on a shelf is not
; where anyone wants a dependency that stopped being maintained.
lib_deps =
