; MeterCam's gas meter camera: AI-Thinker ESP32-CAM, OV2640.
;
; TWO BUILDS OFF ONE BOARD, and they are opposites on purpose.
;
;   gas-cam   src/main.cpp    what lives in the cupboard. Wakes on a timer,
;                             lights the meter, takes a few frames, POSTs them
;                             to MeterCam, asks whether there is a newer build,
;                             and goes back to sleep. Holds no state, keeps no
;                             clock and never waits to be called -- which is
;                             the whole reason it can sleep at all.
;
;   focus     src/focus.cpp   what you hold at the meter. Never sleeps, serves
;                             an MJPEG stream and a sharpness readout, and
;                             sends nothing anywhere. For aiming the board and
;                             turning the OV2640's lens onto the digits. It is
;                             a bench tool: it times itself out after
;                             FOCUS_MINUTES because this board runs hot awake,
;                             and that is the reason the other build sleeps.
;
;   pio run -e gas-cam                build the cupboard firmware
;   pio run -e gas-cam -t upload      flash it, over the MB programmer shield
;   pio run -e focus -t upload -t monitor   flash the bench one and watch it
;                                           print the URL to open
;
; After its first flash gas-cam updates itself: see the OTA section in
; src/main.cpp. focus deliberately has no OTA -- it is not meant to be
; anywhere you cannot reach with a cable.
;
; BUILD FROM POWERSHELL, NOT GIT BASH. PlatformIO refuses MSys/Mingw and
; leaves a half-installed esptool behind that every later build then trips
; over. Same trap as PowerStation/ -- see that project's notes.

[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; The camera needs PSRAM, and a UXGA frame is a ~2 MB allocation that will not
; come out of internal RAM. The huge_app partition is for the OTA half: two app
; slots have to fit beside SPIFFS, and the default table has no room for a
; camera build twice over.
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; Kept deliberately small. Everything here is in the Arduino core or the
; ESP32 camera driver that ships with it; a meter camera on a shelf is not
; where anyone wants a dependency that stopped being maintained.
lib_deps =

; Both firmwares define setup() and loop(), so each build takes exactly one of
; them. include/ is shared: board.h is the module's wiring, config.h the
; secrets and the numbers, and both builds want the same answers from both.
[env:gas-cam]
build_src_filter = +<*> -<focus.cpp>

[env:focus]
build_src_filter = +<focus.cpp>
