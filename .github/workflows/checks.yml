name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  home-assistant:
    name: Home Assistant tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r HomeAssistant/tools/requirements.txt
      - name: DTEK schedule maths
        run: python HomeAssistant/tools/test_dtek_schedule.py
      - name: DTEK package templates
        run: python HomeAssistant/tools/check_dtek_templates.py
      - name: Automations and IR bridge scripts
        run: python HomeAssistant/tools/check_automations.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Climate card chart maths
        run: node HomeAssistant/tools/test_climate_chart.js

  irbridge:
    name: IRBridge Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IRBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu-latest image ships the Android SDK and sets ANDROID_HOME, so
      # there is nothing to install.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
