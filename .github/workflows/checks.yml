name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  home-assistant:
    name: Home Assistant tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r HomeAssistant/tools/requirements.txt
      - name: DTEK schedule maths
        run: python HomeAssistant/tools/test_dtek_schedule.py
      - name: DTEK package templates
        run: python HomeAssistant/tools/check_dtek_templates.py
      - name: Automations and IR bridge scripts
        run: python HomeAssistant/tools/check_automations.py
      - name: Entity references across the config
        run: python IRBridge/tools/check_ha_entities.py HomeAssistant/config
      - name: Outage pre-charge plan and automations
        run: python HomeAssistant/tools/test_outage_precharge.py
      - name: Adaptive night charge plan and automations
        run: python HomeAssistant/tools/test_adaptive_charge.py
      - name: Load shedding engine
        run: python HomeAssistant/tools/test_load_shedding.py
      - name: Battery runtime
        run: python HomeAssistant/tools/test_battery_runtime.py
      - name: Day/night tariff switch
        run: python HomeAssistant/tools/test_tariff_switch.py
      - name: Monthly gas reading, the local half
        run: python HomeAssistant/tools/test_gas_submit.py
      - name: Monthly electricity reading window and buttons
        run: python HomeAssistant/tools/test_electricity_submit.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Climate card chart maths
        run: node HomeAssistant/tools/test_climate_chart.js
      - name: Battery and inverter card history
        run: node HomeAssistant/tools/test_console_history.js
      - name: Inverter, battery and load-shedding cards
        run: node HomeAssistant/tools/test_power_cards.js

  power-station:
    name: PowerStation firmware logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r HomeAssistant/tools/requirements.txt
      # The real lambdas out of power-station.yaml, compiled with the runner's
      # own g++ (the script falls back to the gcc:13 image only without one).
      - name: Extract, compile and run
        run: python PowerStation/tools/test_firmware_logic.py

  electricity-meter:
    name: ElectricityMeter firmware logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The firmware's detector and MQTT sources, compiled with the runner's
      # g++: the golden captures, the commands, the discovery payloads.
      - name: Detector on the golden captures, MQTT behaviour and discovery
        run: python ElectricityMeter/tools/test_firmware.py

  meterbots:
    name: MeterBots and MeterCam services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask
      # Fake bots and a fake Telegram client: no network, no Telethon.
      - name: The gas bot's walk
        run: python MeterBots/tests/test_gasbot.py
      - name: The YASNO bot's walk
        run: python MeterBots/tests/test_yasnobot.py
      - name: The shared Telegram walker and its lock
        run: python MeterBots/tests/test_tgclient.py
      - name: Routes and tokens
        run: python MeterBots/tests/test_app.py
      - name: Deploy scripts parse
        run: for f in MeterBots/deploy/*.sh; do sh -n "$f"; done
      # MeterCam stays a camera service: its routes, read without OpenCV.
      - name: MeterCam has no bot routes
        run: python MeterCam/tests/test_routes.py

  proxmox:
    name: Proxmox backup hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host scripts parse
        run: for f in Proxmox/tools/*.sh; do sh -n "$f"; done
      # The hook deletes off-site copies: its failure paths, against a fake
      # Drive and a fake Proxmox in a throwaway Debian container.
      - name: The off-site hook, failures included
        run: sh Proxmox/tools/test_vzdump_offsite.sh

  irbridge:
    name: IRBridge Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IRBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu-latest image ships the Android SDK and sets ANDROID_HOME, so
      # there is nothing to install.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
