; ElectricityMeter: a photodiode module on a Lolin NodeMCU V3 (ESP8266), watching
; the electricity meter's imp/kWh LED.
;
; src/main.cpp samples the raw A0 value a hundred times a second, counts the
; meter's blinks (include/detector.h) and reports the register and the power to
; Home Assistant over MQTT (src/mqtt_link.cpp). The live page from stage one is
; still there for tuning at the meter. Setup, from wiring to commissioning, is
; in ../../docs/setup.md.
;
; TWO WAYS TO FLASH THE SAME BUILD:
;
;   pio run -e usb -t upload -t monitor     over the cable, the first time
;   pio run -e ota -t upload --upload-port <board-ip>
;                                           over WiFi, once it is mounted
;
; The ota build reads the OTA password from ELECTRICITY_METER_OTA_PASSWORD, which
; must match OTA_PASSWORD in include/config.h:
;
;   $env:ELECTRICITY_METER_OTA_PASSWORD = '...'
;
; The Lolin V3 is a NodeMCU v2 clone with a CH340 on it; nodemcuv2 is the
; board definition that matches its flash and pinout.
;
; BUILD FROM POWERSHELL, NOT GIT BASH. PlatformIO refuses MSys/Mingw and
; leaves a half-installed esptool behind that every later build then trips
; over. Same trap as PowerStation/ -- see that project's notes.

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; The Arduino core brings the web server, mDNS, ArduinoOTA and LittleFS;
; PubSubClient is the one library on top, for MQTT.
lib_deps =
    knolleary/PubSubClient @ ^2.8

; The register is saved to /state on LittleFS (src/persist.cpp). The
; filesystem formats itself on first boot; there is nothing to upload.
board_build.filesystem = littlefs

[env:usb]

[env:ota]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.ELECTRICITY_METER_OTA_PASSWORD}
