- id: '1783284466403'
  alias: "\U0001F4A1Kitchen: Force Light On"
  description: 'Kitchen light-off block: while the helper is on, the kitchen light is switched back on whenever it is turned off. With the helper off, control is manual.'
  triggers:
  - entity_id: light.kitchen_relay
    to: 'off'
    trigger: state
  - entity_id: input_boolean.kitchen_light_force_on
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.kitchen_light_force_on
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.kitchen_relay
  mode: restart
- id: '1783546168549'
  alias: "\U0001F4A1Kitchen: Block Light On "
  description: 'Kitchen light-on block: while the helper is on, the kitchen light is switched back off whenever it is turned on (by hand or at the switch). With the helper off, control is manual.'
  triggers:
  - entity_id: light.kitchen_relay
    to: 'on'
    trigger: state
  - entity_id: input_boolean.kitchen_light_block
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.kitchen_light_block
    state: 'on'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.kitchen_relay
  mode: restart
- id: '1787508286055'
  alias: 'IR Blaster: Battery Safe Charge'
  description: Keep the IR blaster phone's battery between 20 and 80%
  triggers:
  - entity_id: sensor.ir_blaster_battery_level
    below: 21
    id: start_charging
    trigger: numeric_state
  - entity_id: sensor.ir_blaster_battery_level
    above: 79
    id: stop_charging
    trigger: numeric_state
  - entity_id: switch.0xa4c138c211306160
    to: 'off'
    id: relay_accidentally_off
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start_charging
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.0xa4c138c211306160
    - conditions:
      - condition: trigger
        id: stop_charging
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.0xa4c138c211306160
    - conditions:
      - condition: trigger
        id: relay_accidentally_off
      - condition: numeric_state
        entity_id: sensor.ir_blaster_battery_level
        below: 20
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.0xa4c138c211306160
  mode: single
