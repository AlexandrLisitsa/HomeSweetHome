- id: '1774992861274'
  alias: 'Tariff: Auto Switch Day/Night'
  description: 'Switches the inverter counter at 07:00 and 23:00, and again on every Home Assistant start: a restart across a boundary otherwise leaves the whole night booked as day. The zone comes from the clock, not the trigger, so every trigger lands on the right one.'
  triggers:
  - at: 07:00:00
    trigger: time
  - at: '23:00:00'
    trigger: time
  - trigger: homeassistant
    event: start
  actions:
  - action: select.select_option
    target:
      entity_id: select.grid_real_tariff
    data:
      option: '{{ ''day'' if 7 <= now().hour < 23 else ''night'' }}'
  mode: single
- id: '1775345704528'
  alias: '❌ Alert: Grid Outage!'
  description: 'on = UNSAFE (the ESPHome sensor''s polarity). From ''off'' only, so an ESPHome reconnect during an outage does not page again, and held 20 s, so the few-second blips the grid has many times a day do not page at all.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.powmr_inverter_grid_condition_safe
    from: 'off'
    to: 'on'
    for:
      seconds: 20
  actions:
  - wait_template: '{{ states(''sensor.battery_runtime_remaining'') | is_number }}'
    timeout: '00:00:15'
    continue_on_timeout: true
  - variables:
      battery_line: "{% set r = states('sensor.battery_runtime_remaining') %}{% set s = states('sensor.jkbms_gateway_bms_state_of_charge') %}{% if r | is_number and s | is_number %}Battery {{ s | float | round(0) }}%, about {{ r | float | round(1) }} h left at the current draw.{% elif s | is_number %}Battery {{ s | float | round(0) }}%.{% endif %}"
      dtek_line: "{% if is_state('binary_sensor.dtek_outage_now', 'on') %}{% set e = state_attr('sensor.dtek_shutdowns', 'outage_end') %}DTEK: {{ state_attr('sensor.dtek_shutdowns', 'outage_reason') or 'outage on record' }}{% if e %}, expected back by {{ as_datetime(e) | as_local | as_timestamp | timestamp_custom('%H:%M') }}{% endif %}.{% else %}DTEK has nothing on record yet.{% endif %}"
  - action: notify.household
    data:
      title: '❌ Alert: Grid Outage!'
      message: 'Grid failure detected. The inverter is now running on battery power! {{ battery_line }} {{ dtek_line }}'
      data:
        ttl: 0
        priority: high
        channel: Emergency
  - action: notify.persistent_notification
    data:
      title: '❌ Alert: Grid Outage!'
      message: 'Grid failure detected. The inverter is now running on battery power! {{ battery_line }} {{ dtek_line }}'
  mode: single
- id: '1775345768954'
  alias: ✅ Power Restored
  description: Only after an outage long enough to have been announced (20 s, the Grid Outage alert's hold).
  triggers:
  - entity_id:
    - binary_sensor.powmr_inverter_grid_condition_safe
    from:
    - 'on'
    to:
    - 'off'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 20 }}'
  actions:
  - variables:
      dtek_line: "{% if is_state('binary_sensor.dtek_outage_now', 'on') %}{% set e = state_attr('sensor.dtek_shutdowns', 'outage_end') %}DTEK still reports an outage{% if e %} until {{ as_datetime(e) | as_local | as_timestamp | timestamp_custom('%H:%M') }}{% endif %}.{% endif %}"
  - action: notify.household
    data:
      title: ✅ Power Restored
      message: 'Grid parameters are normal. The inverter has switched to grid power. {{ dtek_line }}'
      data:
        ttl: 0
        priority: high
        channel: Emergency resolved
  - action: notify.persistent_notification
    data:
      title: ✅ Power Restored
      message: 'Grid parameters are normal. The inverter has switched to grid power. {{ dtek_line }}'
  mode: single
- id: '1778275569737'
  alias: "\U0001F4A7 Alert: Water Leak Detected!"
  description: 'Pages every minute while the sensor is wet. Also started by a Home Assistant restart and a 5-minute watchdog while wet: the to-on trigger never fires again for a sensor that was already wet when the loop died.'
  triggers:
  - entity_id: binary_sensor.0xa4c13898ee89fea1_water_leak
    to: 'on'
    trigger: state
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: binary_sensor.0xa4c13898ee89fea1_water_leak
    state: 'on'
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.0xa4c13898ee89fea1_water_leak
        state: 'on'
      sequence:
      - action: notify.household
        data:
          title: "\U0001F4A7 CRITICAL ALERT: WATER LEAK!"
          message: Water detected! The sensor has registered a leak. Please check
            immediately!
          data:
            ttl: 0
            priority: high
            channel: Water Leak
      - action: persistent_notification.create
        data:
          notification_id: water_leak
          title: "\U0001F4A7 Warning: Water Leak Detected!"
          message: A water leak has been detected. Notifications will be sent every
            minute until it is dry.
      - delay:
          minutes: 1
  mode: single
  max_exceeded: silent
- id: '1778275645292'
  alias: '✅ Alert Cleared: Water Leak Resolved'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.0xa4c13898ee89fea1_water_leak
    from: 'on'
    to: 'off'
  actions:
  - action: notify.household
    data:
      title: ✅ Water Leak Resolved
      message: The sensor is now dry. The water leak alert has been cleared.
      data:
        ttl: 0
        priority: high
        channel: Water Leak Resolved
  - action: persistent_notification.dismiss
    data:
      notification_id: water_leak
  mode: single
- id: '1790700000001'
  alias: "\U0001F4A7 Alert: Leak Sensor Offline"
  description: A sensor that is unavailable cannot report a leak -- and a battery shorting in water looks exactly like this.
  triggers:
  - trigger: state
    entity_id: binary_sensor.0xa4c13898ee89fea1_water_leak
    to: unavailable
    for:
      minutes: 10
  actions:
  - action: notify.household
    data:
      title: "\U0001F4A7 Leak sensor offline"
      message: The water leak sensor has been unavailable for 10 minutes and cannot report a leak. Check it and its battery.
      data:
        ttl: 0
        priority: high
        channel: Water Leak
  mode: single
- id: '1779645666848'
  alias: '⚠️ Alert: Battery Low!'
  description: 'Ignores the BMS coming back from unavailable already low: that is a reconnect, not a new crossing.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.jkbms_gateway_bms_state_of_charge
    below: 21
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unavailable'', ''unknown'', ''none''] }}'
  actions:
  - variables:
      battery_line: "{% set r = states('sensor.battery_runtime_remaining') %}{% set s = states('sensor.jkbms_gateway_bms_state_of_charge') %}{% if r | is_number and s | is_number %}Battery {{ s | float | round(0) }}%, about {{ r | float | round(1) }} h left at the current draw.{% elif s | is_number %}Battery {{ s | float | round(0) }}%.{% endif %}"
  - action: notify.household
    data:
      title: '⚠️ Alert: Battery Low!'
      message: 'Battery level has dropped to 20% or below! Please conserve power. {{ battery_line }}'
      data:
        ttl: 0
        priority: high
        channel: Emergency
  - action: notify.persistent_notification
    data:
      title: '⚠️ Alert: Battery Low!'
      message: 'Battery level has dropped to 20% or below! Please conserve power. {{ battery_line }}'
  mode: single
- id: '1779645723464'
  alias: "\U0001F50B Battery Recovered"
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id: sensor.jkbms_gateway_bms_state_of_charge
    above: 25
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unavailable'', ''unknown'',
      ''none''] }}'
  actions:
  - action: notify.household
    data:
      title: "\U0001F50B Battery Recovered"
      message: Battery has charged above 25%. Emergency state cleared.
      data:
        ttl: 0
        priority: high
        channel: Emergency resolved
  - action: notify.persistent_notification
    data:
      title: "\U0001F50B Battery Recovered"
      message: Battery has charged above 25%. Emergency state cleared.
  mode: single
- id: '1782502124150'
  alias: "\U0001F4A1Corridor: Motion Controlled Light"
  description: 'Smart hallway light: handles the switch being turned off by voice, picks up presence, and does NOT interfere with manual control while the automation is disabled.'
  triggers:
  - entity_id: binary_sensor.0xa4c1386081a8a521_occupancy
    to: 'on'
    id: motion_start
    trigger: state
  - entity_id: binary_sensor.0xa4c1386081a8a521_occupancy
    to: 'off'
    for:
      seconds: 30
    id: motion_stop
    trigger: state
  - entity_id: light.hallway_relay
    to: 'off'
    id: light_turned_off
    trigger: state
  - entity_id: input_boolean.hallway_light_sensor
    to: 'on'
    id: automation_enabled
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: motion_start
        - condition: trigger
          id: automation_enabled
      - condition: state
        entity_id: input_boolean.hallway_light_sensor
        state: 'on'
      - condition: state
        entity_id: binary_sensor.0xa4c1386081a8a521_occupancy
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hallway_relay
    - conditions:
      - condition: trigger
        id: motion_stop
      - condition: state
        entity_id: input_boolean.hallway_light_sensor
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.hallway_relay
    - conditions:
      - condition: trigger
        id: light_turned_off
      - condition: state
        entity_id: input_boolean.hallway_light_sensor
        state: 'on'
      - condition: state
        entity_id: binary_sensor.0xa4c1386081a8a521_occupancy
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hallway_relay
  mode: restart
