# ---------------------------------------------------------------------------
# MeterCam — gas
#
# Reads the dial from the camera via the MeterCam service and, when the
# service says the reading is trustworthy, types it into the SAME
# input_number a human would have typed. See MeterCam/README.md.
#
# ---------------------------------------------------------------------------
# Why it writes to the helper and not to a sensor of its own
#
# Everything downstream — sensor.gas_meter_reading and its unique_id, both
# utility meters, the Energy dashboard's Gas tab — is already wired to
# input_number.gas_meter_manual_reading. The dashboard's half of that wiring
# lives in .storage/energy, is not fetched by ha_pull.sh and cannot be restored
# from the repo. A new entity would mean re-pointing all of it by hand and
# leaving every existing m³ of statistics attached to the old one.
#
# So the camera replaces the typist, not the plumbing.
#
# ---------------------------------------------------------------------------
# Why a script and an automation rather than a rest: sensor
#
# A `rest:` sensor polls on its own schedule and stores whatever comes back,
# including the readings MeterCam refused — you would be filtering after the
# fact, on a total_increasing sensor, which is the one place filtering after
# the fact does not work.
#
# rest_command + response_variable inverts that: look at the verdict first,
# write only if it says yes. The script holds that logic and the automation
# only supplies a clock, so running it by hand and running it on a timer are
# the same code rather than two copies that drift apart.
#
# ---------------------------------------------------------------------------
# The collision rule
#
# `rest_command:`, `script:`, `input_text:` are dict domains, so packages merge
# them BY KEY and duplicate keys collide — the same discipline gas_meter.yaml
# and the irbridge_* packages follow. Every key here is metercam_- or
# gas_meter_-prefixed. `rest_command:` merges with the irbridge commands
# included from configuration.yaml line 500; the prefixes are what keeps that
# safe.
# ---------------------------------------------------------------------------

rest_command:
  # timeout: 30 is load-bearing and the default of 10 is not enough. The
  # service takes FIVE frames and requires them to agree, so a good read is
  # seconds rather than a second — and with a torch configured, five settles on
  # top. A timeout here looks exactly like a camera fault and is not.
  #
  # No X-Auth-Token: METERCAM_TOKEN is unset on the LAN deployment, and
  # /health reports "auth": "DISABLED". If that changes, add
  #   headers:
  #     X-Auth-Token: !secret metercam_token
  # and the service will start requiring it.
  metercam_read_gas:
    # Query string in the URL, not a `params:` block -- rest_command has no
    # such option and refuses to load with one. `ha core check` does NOT catch
    # that: it validates YAML and includes, but a per-integration schema is
    # only applied when the integration loads, so this passed the check and
    # failed in the log with the entity quietly absent.
    #
    # prevalue is what makes the rate limit and the decrease check possible.
    # Without it MeterCam refuses outright rather than accept an unguarded
    # reading -- see require_prevalue in its config.
    # secrets.yaml: metercam_read_gas_url: "http://<metercam-ip>:8770/read?meter=gas&prevalue={{ prevalue }}"
    url: !secret metercam_read_gas_url
    method: GET
    timeout: 30

input_text:
  # The last verdict, in words. Not part of the Energy chain and deliberately
  # so: it exists to be looked at while deciding whether to trust any of this,
  # and it costs nothing to delete afterwards.
  #
  # An input_text rather than logbook entries because a refused frame every
  # five minutes is 288 logbook lines a day, and the reason is more useful as
  # "the current state" than as a stream.
  gas_meter_camera_status:
    name: "Gas meter camera status"
    icon: mdi:camera-iris
    max: 255

script:
  metercam_read_gas:
    alias: "MeterCam: read the gas meter"
    icon: mdi:camera-iris
    # single: a read holds the camera for several seconds and there is one
    # camera. Overlapping runs would queue behind MeterCam's own lock anyway.
    mode: single
    sequence:
      # continue_on_error so a refused connection lands in the status text
      # below instead of aborting the script silently. The container being
      # down is a thing you want to read, not a thing you want to not happen.
      - service: rest_command.metercam_read_gas
        continue_on_error: true
        data:
          prevalue: "{{ states('sensor.gas_meter_reading') | float(0) }}"
        response_variable: reading

      - variables:
          # One guarded boolean rather than a chain of conditions, because
          # `reading` is undefined when the call itself failed and any
          # dotted access on it would raise before the default branch runs.
          body: >-
            {{ reading.content if reading is defined
               and reading.content is defined else {} }}
          accepted: >-
            {{ reading is defined
               and (reading.status | default(0)) == 200
               and body is mapping
               and (body.accepted | default(false)) }}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ accepted }}"
            sequence:
              # body.value carries 0.01 m3, not the dial's full 0.001: MeterCam
              # publishes only what it will stand behind, and the fastest drum
              # cannot be confirmed across a burst while the boiler is firing.
              # See report_decimals in MeterCam/README.md. The input_number's
              # own step stays 0.001 so a human can still type the whole dial --
              # MeterCam trims the prevalue it is given before comparing, so the
              # two resolutions mix without manufacturing a decrease.
              - service: input_number.set_value
                target:
                  entity_id: input_number.gas_meter_manual_reading
                data:
                  value: "{{ body.value }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.gas_meter_camera_status
                data:
                  value: >-
                    {{ now().strftime('%H:%M') }} accepted {{ body.value }}
        default:
          - service: input_text.set_value
            target:
              entity_id: input_text.gas_meter_camera_status
            data:
              value: >-
                {{ now().strftime('%H:%M') }} refused:
                {{ (body.reason if body is mapping and body.reason
                    else 'no response from MeterCam')
                   | string | truncate(200, true) }}

automation:
  # SHIPPED DISABLED. `initial_state: false` turns it off at every restart, not
  # just the first — so it stays off until the line is deleted, which is the
  # point while the camera is still a phone on a shelf and the ESP32 has not
  # been mounted or aimed.
  #
  # Until then, run script.metercam_read_gas by hand and read
  # input_text.gas_meter_camera_status. It is the same code path this will use.
  #
  # Deleting `initial_state: false` is the whole of "going live", and it should
  # not happen before tools/score.py passes on a labelled corpus:
  # zero wrong among accepted, and enough throughput to fill the hourly bars.
  - id: metercam_gas_poll
    alias: "MeterCam: poll the gas meter"
    mode: single
    max_exceeded: silent
    initial_state: false
    # 20 traces rather than the default 5: at one poll every five minutes that
    # is over an hour and a half of full request/response history to look at
    # during the shadow period, without adding a single entity to store it.
    trace:
      stored_traces: 20
    trigger:
      - platform: time_pattern
        minutes: "/5"
    action:
      - service: script.metercam_read_gas
