# ---------------------------------------------------------------------------
# Gas meter — consumption from a reading typed off the dial
#
# One helper holds the number printed on the meter face, one template sensor
# publishes it in the shape the Energy dashboard accepts, and two utility
# meters cut it into a daily and a monthly figure.
#
# ---------------------------------------------------------------------------
# Why this file exists
#
# The house measures electricity two ways and gas none. The Energy dashboard
# has a gas section that has always been empty, and the only gas number anyone
# had was whatever the dial said the last time somebody crouched down and read
# it. Typing that number in once a month is not measurement, but it is a
# series — and a series is what makes a bill checkable and a doubling
# noticeable.
#
# Counting the index drum with a reed switch is the eventual plan and is being
# tried on a branch. It is not here yet and may never be: that trial has so far
# failed to find any magnet in the index at all. This file does not wait for it.
#
# ---------------------------------------------------------------------------
# One entity, whatever the source turns out to be
#
# Long-term statistics are keyed by statistic id, and the Energy dashboard
# stores that id rather than following a rename. So the sensor below is the only
# gas entity the dashboard is ever pointed at. When counting hardware does start
# reporting, it feeds this same name and this same unique_id, and every m³
# recorded by hand before then stays in one continuous series. Pointing the
# dashboard at a second, "real" sensor later would not move the old history — it
# would simply stop being looked at.
#
# Which is also why the hand-typed helper is worth keeping after hardware
# arrives: it stays the reference a pulse count gets calibrated against,
# including after a power loss wipes a counter held in RTC memory.
#
# ---------------------------------------------------------------------------
# Why the reading is gated on `> 0` and not on `| is_number`
#
# A helper in the input_number domain with no `initial:` and nothing to restore
# comes up at its `min:`, not at `unknown` — the integration falls back to the
# configured minimum when there is no stored state. So the first boot after this
# lands publishes a hard 0.0.
#
# A `total_increasing` sensor whose first observed value is 0 has its statistics
# zero point set to 0. The next value — the real dial reading — is then recorded
# as consumption, because the compiler differences consecutive states: 1234.5
# minus 0 is 1234.5 m³ of gas in a single hour, permanently, as a row in the
# statistics table. That is not cosmetic; it is tens of thousands of hryvnia of
# imaginary gas, and it outlives any amount of retyping.
#
# Whereas a sensor whose FIRST-EVER value is 1234.5 contributes exactly zero.
# The compiler takes its initial-sum branch, logs "zero point set to 1234.5",
# stores sum=0, and only differences from there. Worth grepping the log for that
# line once, after the first entry.
#
# Consequence: `min:` is deliberately 0 below, and NOT the useful default that
# irbridge_ac_energy.yaml argues for. Any other minimum would fabricate a
# baseline out of that restore fallback. Do not "fix" it.
#
# ---------------------------------------------------------------------------
# What a typo costs
#
# Correcting a reading downward by more than 10% is read as a meter reset, so
# the over-reported total is not undone by retyping — it stays. The fix is
# Developer tools -> Statistics -> Adjust sum on the reading sensor, which is
# exactly what that dialog is for. A correction under 10% produces one negative
# hour and heals itself on the next entry.
#
# And everything typed lands in the hour it was typed. The monthly total is
# right; the daily and hourly bars are a single spike, and are fiction.
#
# ---------------------------------------------------------------------------
# The collision rule
#
# `utility_meter:` and `input_number:` are dict domains, so packages merge them
# BY KEY and duplicate keys collide (list domains like `template:` merge by
# appending and cannot). Every key below is `gas_meter_`-prefixed for that
# reason — the same discipline the irbridge_* packages follow.
# ---------------------------------------------------------------------------

utility_meter:
  # periodically_resetting: false is the flag that matters, and it is the same
  # reasoning as irbridge_ac_energy.yaml: the source only ever climbs, and with
  # the default (true) any dropout is read as a reset and loses everything
  # accumulated since the last report. False makes the meter difference against
  # the last value it actually saw — which is also what makes a source that
  # sits unavailable between readings harmless here.
  #
  # always_available: true so a gap leaves the last figure on the card rather
  # than blanking it.
  #
  # Both source the reading sensor rather than the helper directly, because the
  # reading sensor is the one name that survives a change of source. These two
  # keep working when counting hardware eventually replaces the typing.
  #
  # Two things about deploying this, because neither is guessable. Nothing in
  # this domain registers a reload service, so creating these takes a full
  # `ha core restart`. And a utility meter never seeds from its source's current
  # state, only from a change to it — so after that restart both read `unknown`
  # until the reading moves once, which with a hand-typed meter could be a
  # month. Restart first, type the dial second, and the seeding happens in the
  # same motion.
  gas_meter_daily:
    name: "Gas today"
    unique_id: gas_meter_daily
    source: sensor.gas_meter_reading
    cycle: daily
    periodically_resetting: false
    always_available: true

  gas_meter_monthly:
    name: "Gas this month"
    unique_id: gas_meter_monthly
    source: sensor.gas_meter_reading
    cycle: monthly
    periodically_resetting: false
    always_available: true

template:
  - sensor:
      # What the meter face reads, so a bill can be checked without arithmetic,
      # and the single entity the Energy dashboard is pointed at.
      #
      # device_class: gas + m³ + total_increasing is not three lines of
      # boilerplate — it is exactly what the Energy dashboard's gas picker
      # filters on, deriving a "volume" unit class from the device class and the
      # unit. All three attributes survive unavailability, so this shows up in
      # the picker before it has ever reported a number.
      #
      # `none` rather than a plausible-looking zero when there is nothing to
      # report. Unknown and unavailable states are skipped both by the
      # statistics compiler and by the utility meters above. A zero would not be
      # skipped. It would be a reading.
      - name: "Gas meter reading"
        unique_id: gas_meter_reading
        device_class: gas
        state_class: total_increasing
        unit_of_measurement: "m³"
        icon: mdi:counter
        availability: >-
          {{ states('input_number.gas_meter_manual_reading') | float(0) > 0 }}
        state: >-
          {% set manual = states('input_number.gas_meter_manual_reading') | float(0) %}
          {{ manual | round(3) if manual > 0 else none }}

input_number:
  # The dial reading, typed in by hand. The index has 8 drums with 3 decimals,
  # so it reads to 0.001 m³; mode: box because a slider for a six-digit number
  # would be an unkind joke.
  #
  # `min: 0` is load-bearing — see the banner. No `initial:`, and do not raise
  # the minimum to something plausible-looking.
  gas_meter_manual_reading:
    name: "Gas meter manual reading"
    icon: mdi:pencil
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: "m³"
    mode: box

  # Wired into .storage/energy as the gas source's price entity, so the Energy
  # dashboard's cost column is real money. An entity rather than the fixed
  # number the two grid sources use, for two reasons: it lives in this file and
  # therefore in git, and a tariff change is then a UI edit instead of a
  # .storage edit behind `ha core stop`.
  #
  # The unit MUST carry the slash. The energy integration checks a price
  # entity's unit against a set of plain VOLUME units and, not finding "UAH/m³"
  # among them, falls back to its default — which for gas is no conversion at
  # all, i.e. per m³ of whatever the source reports. Write a bare "m³" or "L"
  # here and that fallback is skipped and a real unit conversion gets applied to
  # the money instead. The ³ is U+00B3; "m3" is a different string.
  #
  # min: 0 again, and here it is the right default on purpose: a zero tariff
  # under-reports visibly and corrects itself the moment it is set, where a
  # guessed one mis-reports invisibly forever.
  #
  # Set to 7.95689, the figure the Naftogaz cabinet itself prints, on the annual
  # fixed product locked 1 May 2026 to 30 April 2027. Including VAT.
  #
  # Distribution — about 1.08 per m³ from the Dnipro branch of Gazmerezhi — is
  # deliberately NOT added in, even though it is charged per cubic metre
  # consumed and so would give the true delivered cost of around 9.04. The point
  # of this number is that the Energy dashboard reconciles against the
  # supplier's own invoices to the kopeck: a month's billed volume × 7.95689 is
  # exactly what the cabinet billed for it. Folding in a second company's tariff
  # would make every figure disagree with the bill it is meant to check.
  #
  # So the cost column under-reports the true cost of gas by roughly 12%, on
  # purpose. If that ever stops being the wanted trade-off, this is the one
  # place to change and the backfilled history would need recomputing to match.
  gas_meter_price:
    name: "Gas tariff"
    icon: mdi:cash
    min: 0
    max: 1000
    step: 0.01
    unit_of_measurement: "UAH/m³"
    mode: box
