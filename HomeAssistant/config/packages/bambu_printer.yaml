# ---------------------------------------------------------------------------
# Bambu Lab P2S: print done / plate cool / failed / HMS error, to the
# household's phones
#
# The printer comes in through ha-bambulab (greghesp/ha-bambulab, installed
# from the Marketplace), a config entry: none of its entities are defined in
# this repo. The device is "P2S" and every entity id starts with p2s_.
#
# Each alert carries the job's cover image (the sliced plate), fetched by the
# companion app through HA's image proxy. They share one tag, so a "failed"
# or "plate cool" replaces the "done" of the same job on the phone instead of
# stacking.
#
# The from: lists keep a restart from firing them: after a restart the status
# comes back from unknown/offline straight to finish or failed, which is a
# job that already ended, not one that just did.
#
# Filament left: the P2S reports what is left only on RFID Bambu spools
# (`remain` %, -1 otherwise). For everything else HA keeps its own count per
# slot below: a finished job takes its sliced grams off the slot(s) it used,
# a failed one its share up to where it stopped, and loading a spool into an
# empty slot starts it at a full spool. Correct a counter by hand from the
# card (tap the slot) or here in its helper.
#
# Write-up: docs/bambu-printer.md.
# ---------------------------------------------------------------------------

# input_number is a dict domain: packages merge it by key, so every key here
# is p2s_-prefixed. No `initial:`, so HA restores the count after a restart.
input_number:
  p2s_filament_a1:
    name: "P2S filament left A1"
    icon: mdi:printer-3d-nozzle
    min: 0
    max: 3000
    step: 0.1
    unit_of_measurement: "g"
    mode: box
  p2s_filament_a2:
    name: "P2S filament left A2"
    icon: mdi:printer-3d-nozzle
    min: 0
    max: 3000
    step: 0.1
    unit_of_measurement: "g"
    mode: box
  p2s_filament_a3:
    name: "P2S filament left A3"
    icon: mdi:printer-3d-nozzle
    min: 0
    max: 3000
    step: 0.1
    unit_of_measurement: "g"
    mode: box
  p2s_filament_a4:
    name: "P2S filament left A4"
    icon: mdi:printer-3d-nozzle
    min: 0
    max: 3000
    step: 0.1
    unit_of_measurement: "g"
    mode: box
  p2s_filament_ext:
    name: "P2S filament left external"
    icon: mdi:printer-3d-nozzle
    min: 0
    max: 3000
    step: 0.1
    unit_of_measurement: "g"
    mode: box
  # What a freshly loaded spool is counted as. 1 kg is what this house buys.
  p2s_spool_size:
    name: "P2S fresh spool size"
    icon: mdi:printer-3d-nozzle-outline
    min: 100
    max: 3000
    step: 1
    unit_of_measurement: "g"
    mode: box

automation:
  # sensor.p2s_print_weight carries the job's sliced grams per slot as
  # attributes ("AMS 1 Tray 1": 11.7, verified 07.11.2026). The external
  # spool's key has not been seen yet; anything mentioning "xternal" is it.
  # Same from: guard as the alerts, so a restart cannot count a job twice.
  - id: p2s_filament_used
    alias: '3D printer: filament used'
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.p2s_print_status
        from: [running, pause, prepare]
        to: [finish, failed]
    variables:
      # Whole ids, so tools that check entity references can see them.
      counters:
        a1: input_number.p2s_filament_a1
        a2: input_number.p2s_filament_a2
        a3: input_number.p2s_filament_a3
        a4: input_number.p2s_filament_a4
        ext: input_number.p2s_filament_ext
      share: >-
        {{ 1 if trigger.to_state.state == 'finish'
           else ([[states('sensor.p2s_print_progress') | float(0), 0] | max, 100] | min / 100) | round(3) }}
      used: >-
        {% set w = states.sensor.p2s_print_weight %}
        {% set ns = namespace(out={}) %}
        {% for k, v in (w.attributes.items() if w else []) %}
          {% set g = v | float(0) %}
          {% if g > 0 and k.startswith('AMS 1 Tray ') %}
            {% set ns.out = dict(ns.out, **{'a' ~ k[-1]: (g * share) | round(1)}) %}
          {% elif g > 0 and 'xternal' in k %}
            {% set ns.out = dict(ns.out, ext=(g * share) | round(1)) %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}
    action:
      # A job that reports no grams cannot be counted. Say so instead of
      # skipping it quietly: on 10.11.2026 two jobs sliced with density 0
      # reported 0 g and the count silently stayed high.
      - if:
          - condition: template
            value_template: "{{ used | count == 0 }}"
        then:
          - service: notify.household
            data:
              title: '🖨️ Filament not counted'
              message: >-
                {% set task = states('sensor.p2s_task_name') %}
                {{ task if task not in ['unknown', 'unavailable', ''] else 'The last print' }}
                reported no filament weight, so the spool count was not reduced.
                Tap the slot on the printer card and correct it.
              data:
                channel: 3D printer
        else:
          - repeat:
              for_each: "{{ used.keys() | list }}"
              sequence:
                - service: input_number.set_value
                  target:
                    entity_id: "{{ counters[repeat.item] }}"
                  data:
                    value: >-
                      {{ [states(counters[repeat.item]) | float(0) - used[repeat.item], 0]
                         | max | round(1) }}

  # A spool going into an empty slot is a new spool. Putting a half-used one
  # back is the case this gets wrong, so every reset asks on the phone, with
  # an Undo button that puts the old count back (p2s_spool_undo below).
  - id: p2s_spool_loaded
    alias: '3D printer: spool loaded'
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - sensor.p2s_ams_1_tray_1
          - sensor.p2s_ams_1_tray_2
          - sensor.p2s_ams_1_tray_3
          - sensor.p2s_ams_1_tray_4
          - sensor.p2s_external_spool
        attribute: empty
        from: true
        to: false
    # Two guards against the printer's own blips, both from real resets:
    # when it comes back online its first report has the slots empty, and
    # they fill as the AMS reads them (10.11.2026 19:15, 5 s; 11.11.2026
    # 20:09, 3 s: A1 went 824.8 -> 1000 g both times).
    #  - the slot sat empty for at least a minute: a real swap takes longer;
    #  - the printer was online for 2 minutes before the slot went empty: on
    #    a reconnect "online" and "empty" start together, so however slowly
    #    the AMS reads the slots, that is never a swap.
    condition:
      - condition: template
        value_template: "{{ (now() - trigger.from_state.last_changed).total_seconds() >= 60 }}"
      - condition: template
        value_template: >-
          {% set on = states.binary_sensor.p2s_online %}
          {{ on is not none and on.state == 'on'
             and (as_timestamp(trigger.from_state.last_changed) - as_timestamp(on.last_changed)) >= 120 }}
    action:
      - variables:
          counter: >-
            {{ {'sensor.p2s_ams_1_tray_1': 'input_number.p2s_filament_a1',
                'sensor.p2s_ams_1_tray_2': 'input_number.p2s_filament_a2',
                'sensor.p2s_ams_1_tray_3': 'input_number.p2s_filament_a3',
                'sensor.p2s_ams_1_tray_4': 'input_number.p2s_filament_a4',
                'sensor.p2s_external_spool': 'input_number.p2s_filament_ext'}[trigger.entity_id] }}
          slot: >-
            {{ {'sensor.p2s_ams_1_tray_1': 'A1', 'sensor.p2s_ams_1_tray_2': 'A2',
                'sensor.p2s_ams_1_tray_3': 'A3', 'sensor.p2s_ams_1_tray_4': 'A4',
                'sensor.p2s_external_spool': 'External'}[trigger.entity_id] }}
          before: "{{ states(counter) | float(0) | round(1) }}"
          full: "{{ states('input_number.p2s_spool_size') | float(1000) | round(0) }}"
      - service: input_number.set_value
        target:
          entity_id: "{{ counter }}"
        data:
          value: "{{ full }}"
      - service: notify.household
        data:
          title: "🧵 New spool in {{ slot }}?"
          message: >-
            {{ slot }} now counts a full {{ full | int }} g spool (it was {{ before }} g).
            Not a new spool? Tap Undo.
          data:
            channel: 3D printer
            tag: "p2s_spool_{{ slot | lower }}"
            actions:
              - action: "P2S_SPOOL_UNDO|{{ counter }}|{{ before }}"
                title: Undo

  # The Undo button on "New spool in A1?": the action carries the counter and
  # the count it had. Only the five counters are accepted, so a phone cannot
  # set any other helper through this.
  - id: p2s_spool_undo
    alias: '3D printer: undo a spool reset'
    mode: queued
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
    condition:
      - condition: template
        value_template: >-
          {% set p = (trigger.event.data.action | default('') | string).split('|') %}
          {{ p | count == 3 and p[0] == 'P2S_SPOOL_UNDO'
             and p[1] in ['input_number.p2s_filament_a1', 'input_number.p2s_filament_a2',
                          'input_number.p2s_filament_a3', 'input_number.p2s_filament_a4',
                          'input_number.p2s_filament_ext']
             and is_number(p[2]) }}
    action:
      - variables:
          parts: "{{ (trigger.event.data.action | string).split('|') }}"
          counter: "{{ parts[1] }}"
          value: "{{ [[parts[2] | float(0), 0] | max, 3000] | min }}"
          slot: >-
            {{ {'input_number.p2s_filament_a1': 'A1', 'input_number.p2s_filament_a2': 'A2',
                'input_number.p2s_filament_a3': 'A3', 'input_number.p2s_filament_a4': 'A4',
                'input_number.p2s_filament_ext': 'External'}[counter] }}
      - service: input_number.set_value
        target:
          entity_id: "{{ counter }}"
        data:
          value: "{{ value }}"
      - service: notify.household
        data:
          title: "🧵 {{ slot }} count restored"
          message: "{{ slot }} is back to {{ value }} g."
          data:
            channel: 3D printer
            tag: "p2s_spool_{{ slot | lower }}"

  - id: p2s_print_finished
    alias: '3D printer: print done'
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.p2s_print_status
        from: [running, pause, prepare]
        to: finish
    action:
      - service: notify.household
        data:
          title: '🖨️ Print done'
          message: >-
            {% set task = states('sensor.p2s_task_name') %}
            {% set weight = states('sensor.p2s_print_weight') %}
            {{ task if task not in ['unknown', 'unavailable', ''] else 'The print' }} is ready on the P2S
            {%- if is_number(weight) and weight | float > 0 %} ({{ weight | float | round(0) | int }} g){% endif %}.
          data:
            channel: 3D printer
            tag: p2s_print
            image: /api/image_proxy/image.p2s_cover_image

  # Prints come off the plate cleanly once it has cooled: the plastic shrinks
  # off the PEI by itself. 40 °C suits every filament (PLA, PETG, ABS), so the
  # bed temperature decides, not a fixed delay. Same tag as "done", so this
  # replaces it on the phone. A new job starting first cancels it; an hour
  # without a cool reading (sensor gone) sends it anyway. Failed jobs get no
  # follow-up, so their error text stays on the phone.
  - id: p2s_plate_cool
    alias: '3D printer: plate cool, take the print off'
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.p2s_print_status
        from: [running, pause, prepare]
        to: finish
    action:
      - wait_template: >-
          {{ states('sensor.p2s_bed_temperature') | float(99) < 40
             or states('sensor.p2s_print_status') != 'finish' }}
        timeout: '01:00:00'
        continue_on_timeout: true
      - condition: state
        entity_id: sensor.p2s_print_status
        state: finish
      - service: notify.household
        data:
          title: '🧊 Plate is cool'
          message: >-
            {% set task = states('sensor.p2s_task_name') %}
            {{ task if task not in ['unknown', 'unavailable', ''] else 'The print' }} is ready to take off the P2S.
          data:
            channel: 3D printer
            tag: p2s_print
            image: /api/image_proxy/image.p2s_cover_image

  - id: p2s_print_failed
    alias: '3D printer: print failed'
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.p2s_print_status
        from: [running, pause, prepare]
        to: failed
    action:
      - service: notify.household
        data:
          title: '🖨️ Print failed'
          message: >-
            {% set task = states('sensor.p2s_task_name') %}
            {% set err = state_attr('binary_sensor.p2s_print_error', 'error') %}
            {{ task if task not in ['unknown', 'unavailable', ''] else 'The print' }} stopped on the P2S
            {%- if err %}: {{ err | string | truncate(300) }}{% else %}.{% endif %}
          data:
            channel: 3D printer
            tag: p2s_print
            image: /api/image_proxy/image.p2s_cover_image

  # HMS is the printer's health system: clogs, AMS feed problems, a door
  # open mid-print, a fan that stopped. The attributes are numbered from 1:
  # "1-Error", "1-Severity", ... and "Count".
  - id: p2s_hms_error
    alias: '3D printer: HMS error'
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.p2s_hms_errors
        from: 'off'
        to: 'on'
    action:
      - service: notify.household
        data:
          title: '🖨️ P2S needs attention'
          message: >-
            {% set a = trigger.to_state.attributes %}
            {% set n = a.get('Count', 0) | int(0) %}
            {% set ns = namespace(lines=[]) %}
            {% for i in range(1, n + 1) %}
              {% set ns.lines = ns.lines + [(a.get(i ~ '-Severity', '') | string | capitalize)
                                            ~ ': ' ~ a.get(i ~ '-Error', '')] %}
            {% endfor %}
            {{ ns.lines | join('\n') if ns.lines else 'The printer reported a problem. Check its screen.' }}
          data:
            channel: 3D printer
            tag: p2s_hms
