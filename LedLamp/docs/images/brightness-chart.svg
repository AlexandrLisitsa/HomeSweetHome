<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
    <g font-size="10">
      <text x="0" y="14" font-weight="700">Light out of the diffuser, lm</text>
      <g stroke="#eef1f4"><line x1="230" y1="22" x2="230" y2="180"/><line x1="340" y1="22" x2="340" y2="180"/><line x1="450" y1="22" x2="450" y2="180"/><line x1="560" y1="22" x2="560" y2="180"/><line x1="670" y1="22" x2="670" y2="180"/></g>
      <g font-size="8.5" fill="#7a838e"><text x="230" y="192" text-anchor="middle">0</text><text x="340" y="192" text-anchor="middle">2000</text><text x="450" y="192" text-anchor="middle">4000</text><text x="560" y="192" text-anchor="middle">6000</text><text x="670" y="192" text-anchor="middle">8000</text></g>
      <text x="222" y="42" text-anchor="end">Luxel, label</text>
      <rect x="230" y="30" width="297" height="18" fill="#d2d8de"/><text x="533" y="43">5400</text>
      <text x="222" y="72" text-anchor="end">Luxel, realistic (estimate)</text>
      <rect x="230" y="60" width="165" height="18" fill="#aab2bb"/>
      <rect x="395" y="60" width="55" height="18" fill="#d2d8de" stroke="#aab2bb" stroke-dasharray="4 3"/><text x="456" y="73">3000–4000</text>
      <text x="222" y="112" text-anchor="end" font-weight="700">Rebuild, 28 stripes edge to edge</text>
      <rect x="230" y="100" width="333" height="18" fill="#e7a04a"/>
      <rect x="563" y="100" width="36" height="18" fill="#fbe3bf" stroke="#e7a04a" stroke-dasharray="4 3"/><text x="605" y="113" font-weight="700">≈ 6000–6700</text>
      <text x="222" y="152" text-anchor="end">First plan, 16 stripes with gaps</text>
      <rect x="230" y="140" width="176" height="18" fill="#fbe3bf" stroke="#e7a04a" stroke-dasharray="4 3"/><text x="412" y="153">≈ 3200</text>
    </g>
    <text x="0" y="214" font-size="8.5" fill="#7a838e">Any colour temperature. Dashed: estimates, the 30-stripe maximum, or the superseded first plan.</text>
  </svg>
