<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
    <rect x="0" y="95" width="700" height="30" fill="#dfe3e8"/>
    <text x="8" y="140" font-size="9" fill="#7a838e">bare, cleaned metal of the case (isopropyl alcohol)</text>
    <rect x="40" y="70" width="620" height="26" rx="2" fill="#fbe7c4" stroke="#d9a454"/>
    <rect x="40" y="76" width="620" height="14" fill="#fff6e6"/>
    <g>
      <g transform="translate(200,0)">
        <line x1="0" y1="62" x2="0" y2="104" stroke="#d23b3b" stroke-dasharray="3 2"/>
        <rect x="-14" y="72" width="11" height="6" fill="#c98b2b"/><rect x="3" y="72" width="11" height="6" fill="#c98b2b"/>
        <rect x="-14" y="80" width="11" height="6" fill="#c98b2b"/><rect x="3" y="80" width="11" height="6" fill="#c98b2b"/>
        <rect x="-14" y="88" width="11" height="6" fill="#c98b2b"/><rect x="3" y="88" width="11" height="6" fill="#c98b2b"/>
      </g>
      <g transform="translate(460,0)">
        <line x1="0" y1="62" x2="0" y2="104" stroke="#d23b3b" stroke-dasharray="3 2"/>
        <rect x="-14" y="72" width="11" height="6" fill="#c98b2b"/><rect x="3" y="72" width="11" height="6" fill="#c98b2b"/>
        <rect x="-14" y="80" width="11" height="6" fill="#c98b2b"/><rect x="3" y="80" width="11" height="6" fill="#c98b2b"/>
        <rect x="-14" y="88" width="11" height="6" fill="#c98b2b"/><rect x="3" y="88" width="11" height="6" fill="#c98b2b"/>
      </g>
    </g>
    <rect x="40" y="72" width="12" height="6" fill="#c98b2b"/><rect x="40" y="80" width="12" height="6" fill="#c98b2b"/><rect x="40" y="88" width="12" height="6" fill="#c98b2b"/>
    <path d="M44 75 C 20 75 20 30 0 30" stroke="#d23b3b" stroke-width="3" fill="none"/>
    <path d="M44 83 C 14 83 14 45 0 45" stroke="#e08a2c" stroke-width="3" fill="none"/>
    <path d="M44 91 C 8 91 8 60 0 60" stroke="#4f8fd6" stroke-width="3" fill="none"/>
    <g font-size="10">
      <text x="60" y="30" fill="#d23b3b">+24 V</text><text x="60" y="45" fill="#e08a2c">WW −</text><text x="60" y="60" fill="#4f8fd6">CW −</text>
    </g>
    <text x="200" y="56" font-size="10" text-anchor="middle" fill="#d23b3b">cut only through the copper pads</text>
    <text x="460" y="56" font-size="10" text-anchor="middle" fill="#d23b3b">next cut point</text>
    <text x="330" y="118" font-size="9" text-anchor="middle" fill="#7a838e">one cuttable segment</text>
    <path d="M 206 112 H 454" stroke="#7a838e"/>
    <text x="350" y="170" font-size="10" text-anchor="middle" fill="#4a525c">The pad order (+, WW, CW) varies between strips: read the print next to the pads, not this drawing.</text>
    <text x="350" y="186" font-size="10" text-anchor="middle" fill="#4a525c">Tin the pads, solder 0.5 mm² tails, cover with heat-shrink or a drop of neutral silicone.</text>
  </svg>
