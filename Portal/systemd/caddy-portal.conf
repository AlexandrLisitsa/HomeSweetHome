# Drop-in for Debian's caddy.service, installed by deploy.sh as
# /etc/systemd/system/caddy.service.d/portal.conf. It gives the Caddyfile the
# upstream addresses from the box's .env, and points Caddy at this project's
# Caddyfile instead of /etc/caddy's.
[Service]
EnvironmentFile=/opt/portal/.env
ExecStart=
ExecStart=/usr/bin/caddy run --environ=false --config /opt/portal/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/bin/systemctl restart caddy.service
